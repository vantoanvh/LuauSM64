<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SM64 ROM tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <h1 class="title">SM64 ROM tool</h1>
    <p id="statusText" class="status">Choose your Super Mario 64 (US) ROM. Everything runs in this page: the ROM is not uploaded anywhere.</p>

    <input id="fileInput" class="file-input" type="file" accept=".z64,.v64,.n64" />
    <label class="file-picker" for="fileInput">
      <span class="file-action">Choose ROM</span>
      <span class="file-details">
        <span id="fileName" class="file-name">Nothing loaded</span>
        <span id="fileSize" class="file-size">US version, 8 MB</span>
      </span>
    </label>

    <div class="actions">
      <button id="romBtn" class="primary" type="button" disabled>
        <span class="button-label">ROM script</span>
        <span class="button-meta">SM64Rom.rbxmx, no sound data</span>
      </button>
      <button id="soundBtn" class="primary" type="button" disabled>
        <span class="button-label">Sounds</span>
        <span class="button-meta">atlases and list, ZIP</span>
      </button>
    </div>

    <div class="options" aria-label="Options of the ROM script">
      <label class="option">
        <span class="option-text">
          <span class="option-label">Zstd</span>
          <span class="option-meta">Compression</span>
          <span class="option-description">Compresses the ROM to make the script smaller (slow: tens of seconds).</span>
        </span>
        <input id="zstdToggle" class="toggle-input" type="checkbox" />
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
      <label class="option">
        <span class="option-text">
          <span class="option-label">No split lines</span>
          <span class="option-meta">No \z split</span>
          <span class="option-description">Keeps one long string for faster load, but risky to open.</span>
        </span>
        <input id="oneLineToggle" class="toggle-input" type="checkbox" />
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
    </div>

    <div id="progress" class="progress" hidden>
      <span id="progressText"></span>
      <progress id="progressBar" max="1" value="0"></progress>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
